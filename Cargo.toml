[package]
name = "tui-mail"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
native-tls = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
html2text = "0.2"